max_iterations: 80
checkpoint_interval: 50

llm:
  primary_model: "qwen/qwen3.7-max"
  primary_model_weight: 1.0
  api_base: "https://routerai.ru/api/v1"
  temperature: 0.7
  max_tokens: 8000
  timeout: 120

prompt:
  # Full meta prompt loaded from openevolve_sap/prompts/evolution_system_message.md (scheduler)
  system_message: |
    See evolution_system_message.md — loaded at runtime.

database:
  population_size: 40
  archive_size: 20
  # Single island: all workers share one population (simpler scheduling for SAP evals)
  num_islands: 2
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.995

evaluator:
  timeout: 3600
  parallel_evaluations: 2
  # Stage1 (1 prompt, fast FLUX) filters weak candidates before full stage2 eval
  cascade_evaluation: true
  cascade_thresholds: [1.75, 0.0]

diff_based_evolution: true
max_code_length: 60000
# Recycle worker after N evals to limit RAM leaks (10GB GPUs)
max_tasks_per_child: 50

# Stop when alignment_score plateaus (saves GPU time after fitness peaks)
early_stopping_patience: 30
convergence_threshold: 0.05
early_stopping_metric: alignment_score
