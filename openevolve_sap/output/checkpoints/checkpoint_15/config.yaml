max_iterations: 80
checkpoint_interval: 50

llm:
  primary_model: "google/gemini-3.1-pro-preview"
  primary_model_weight: 1.0
  api_base: "https://routerai.ru/api/v1"
  temperature: 0.7
  max_tokens: 8000
  timeout: 120

prompt:
  # Full meta prompt loaded from openevolve_sap/prompts/evolution_system_message.md (scheduler)
  system_message: |
    See evolution_system_message.md — loaded at runtime.

database:
  population_size: 40
  archive_size: 20
  # Single island: all workers share one population (simpler scheduling for SAP evals)
  num_islands: 1
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.995

evaluator:
  timeout: 3600
  parallel_evaluations: 4
  # Set true to run evaluate_stage1 (1 prompt) before full evaluate_stage2
  cascade_evaluation: false
  cascade_thresholds: [0.35, 0.0]

diff_based_evolution: true
max_code_length: 60000
# Recycle worker after N evals to limit RAM leaks (10GB GPUs)
max_tasks_per_child: 30

# Disabled: run all requested iterations (set via --iterations / SAP_EVOLUTION_CYCLES)
early_stopping_patience: null
convergence_threshold: 0.01
early_stopping_metric: combined_score
